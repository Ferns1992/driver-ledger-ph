<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E3A5F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Driver Ledger PH</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- Vendored rather than loaded from a CDN so PDF export works offline. -->
<script src="vendor/jspdf.umd.min.js" defer></script>
<style>
:root{
  --primary:#1E3A5F; --primary-600:#2d4a6f; --secondary:#F59E0B; --accent:#10B981;
  --bg:#F1F5F9; --surface:#FFFFFF; --surface-2:#F8FAFC; --error:#EF4444; --warn:#F59E0B;
  --text:#1F2937; --text-2:#6B7280; --border:#E2E8F0;
  --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
  --shadow-lg:0 8px 24px rgba(16,24,40,.10);
  --r:12px; --r-sm:8px; --r-lg:999px;
  --nav-h:64px; --sidebar-w:248px;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
[data-theme=dark]{
  --primary:#60A5FA; --primary-600:#3B82F6; --secondary:#F59E0B; --accent:#34D399;
  --bg:#0F172A; --surface:#1E293B; --surface-2:#172033; --error:#F87171;
  --text:#F1F5F9; --text-2:#94A3B8; --border:#334155;
  --shadow:0 1px 3px rgba(0,0,0,.4); --shadow-lg:0 8px 24px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* The UA rule for [hidden] is display:none, but any author `display` declaration
   outranks it. Several elements below set display explicitly (.shell is flex,
   .login-wrap is grid) and are also toggled via the hidden attribute, so this
   rule is what actually makes `hidden` work. Without it the app renders
   underneath the login screen and signing in appears to do nothing. */
[hidden]{display:none!important}
html,body{height:100%}
body{
  font-family:var(--font); background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--primary)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- layout ---------- */
.shell{display:flex;min-height:100vh}
.sidebar{
  display:none;width:var(--sidebar-w);flex-direction:column;flex:0 0 var(--sidebar-w);
  background:var(--surface);border-right:1px solid var(--border);padding:1.25rem 1rem;
  position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:.65rem;padding:0 .5rem 1.25rem;font-weight:800;font-size:1.05rem}
.brand-mark{
  width:38px;height:38px;border-radius:10px;flex:0 0 38px;
  background:linear-gradient(135deg,var(--primary),var(--primary-600));
  display:grid;place-items:center;color:#fff;font-size:1.15rem
}
.brand small{display:block;font-weight:500;font-size:.7rem;color:var(--text-2)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-btn{
  display:flex;align-items:center;gap:.7rem;padding:.65rem .75rem;border-radius:var(--r-sm);
  color:var(--text-2);font-weight:600;font-size:.9rem;text-align:left;width:100%;
  transition:background .15s,color .15s;
}
.nav-btn svg{width:20px;height:20px;flex:0 0 20px}
.nav-btn:hover{background:var(--surface-2);color:var(--text)}
.nav-btn[aria-current=page]{background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary)}
.sidebar-foot{margin-top:auto;padding-top:1rem;border-top:1px solid var(--border)}
.who{display:flex;align-items:center;gap:.6rem;padding:.5rem}
.avatar{
  width:34px;height:34px;border-radius:50%;flex:0 0 34px;display:grid;place-items:center;
  background:var(--primary);color:#fff;font-weight:700;font-size:.8rem
}
.who-txt{min-width:0;flex:1}
.who-txt b{display:block;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-txt span{font-size:.72rem;color:var(--text-2);text-transform:capitalize}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:none;align-items:center;justify-content:space-between;gap:1rem;
  padding:1rem 1.75rem;background:var(--surface);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:20;
}
.topbar h1{font-size:1.2rem;font-weight:700}
.content{padding:1rem 1rem calc(var(--nav-h) + 2rem);max-width:1400px;width:100%}
.bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);
  border-top:1px solid var(--border);display:flex;
  padding:.4rem .25rem calc(.4rem + env(safe-area-inset-bottom));
}
.bottomnav .nav-btn{
  flex-direction:column;gap:.15rem;font-size:.68rem;padding:.45rem .2rem;border-radius:0;
  justify-content:center;text-align:center;flex:1
}
.bottomnav .nav-btn svg{width:22px;height:22px}
.bottomnav .nav-btn[aria-current=page]{background:none;color:var(--primary)}
.fab{
  position:fixed;right:1rem;bottom:calc(var(--nav-h) + 1rem);z-index:40;
  width:56px;height:56px;border-radius:50%;background:var(--secondary);color:#fff;
  font-size:1.6rem;line-height:1;box-shadow:0 6px 20px rgba(245,158,11,.45);
  display:grid;place-items:center;transition:transform .12s
}
.fab:active{transform:scale(.94)}

/* ---------- desktop ---------- */
@media (min-width:900px){
  .sidebar{display:flex}
  .topbar{display:flex}
  .bottomnav,.fab{display:none}
  .content{padding:1.75rem 1.75rem 3rem}
}

/* ---------- components ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:1.1rem;margin-bottom:1rem}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
.card-title{font-size:1rem;font-weight:700;display:flex;align-items:center;gap:.5rem}
.card-title .dot{width:8px;height:8px;border-radius:50%;background:var(--primary)}
.grid{display:grid;gap:1rem}
.stats{grid-template-columns:repeat(2,1fr)}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:1rem 1.1rem;box-shadow:var(--shadow);position:relative;overflow:hidden
}
.stat::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--primary)}
.stat.amber::before{background:var(--secondary)}
.stat.green::before{background:var(--accent)}
.stat-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-2);font-weight:700}
.stat-value{font-size:1.5rem;font-weight:800;margin-top:.2rem;letter-spacing:-.02em}
@media (min-width:900px){.stat-value{font-size:1.75rem}}
.stat-sub{font-size:.75rem;color:var(--text-2);margin-top:.15rem}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  padding:.6rem 1.1rem;border-radius:var(--r-sm);font-weight:600;font-size:.875rem;
  transition:filter .15s,transform .1s;white-space:nowrap
}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary);color:#fff}
[data-theme=dark] .btn-primary{color:#0F172A}
.btn-secondary{background:var(--secondary);color:#fff}
.btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.btn-danger{background:var(--error);color:#fff}
.btn-sm{padding:.35rem .65rem;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:.5rem;flex-wrap:wrap}

.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -.1rem}
table{width:100%;border-collapse:collapse;font-size:.875rem;min-width:520px}
th{
  text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;
  color:var(--text-2);font-weight:700;padding:.6rem .7rem;border-bottom:1px solid var(--border);white-space:nowrap
}
td{padding:.7rem;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.money{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--accent);font-weight:700}
.neg{color:var(--error);font-weight:700}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.75rem 0;border-bottom:1px solid var(--border)}
.item:last-child{border-bottom:none}
.item-main{min-width:0;flex:1}
.item-main b{display:block;font-size:.9rem;font-weight:600}
.item-main small{color:var(--text-2);font-size:.78rem}
.item-side{text-align:right;white-space:nowrap}

.badge{display:inline-flex;align-items:center;padding:.15rem .55rem;border-radius:var(--r-lg);font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.badge-admin{background:#dbeafe;color:#1e40af}
.badge-manager{background:#d1fae5;color:#065f46}
.badge-viewer{background:#e2e8f0;color:#475569}
.badge-driver{background:#fef3c7;color:#92400e}
.badge-petrol{background:#d1fae5;color:#065f46}
.badge-diesel{background:#fef3c7;color:#92400e}
[data-theme=dark] .badge-admin{background:#1e3a8a;color:#bfdbfe}
[data-theme=dark] .badge-manager{background:#064e3b;color:#a7f3d0}
[data-theme=dark] .badge-viewer{background:#334155;color:#cbd5e1}
[data-theme=dark] .badge-driver{background:#78350f;color:#fde68a}
[data-theme=dark] .badge-petrol{background:#064e3b;color:#a7f3d0}
[data-theme=dark] .badge-diesel{background:#78350f;color:#fde68a}

.empty{text-align:center;padding:2.5rem 1rem;color:var(--text-2)}
.empty .em{font-size:2rem;display:block;margin-bottom:.5rem;opacity:.6}

.form-group{margin-bottom:.9rem}
label{display:block;font-size:.8rem;font-weight:600;color:var(--text-2);margin-bottom:.35rem}
input,select,textarea{
  width:100%;padding:.6rem .75rem;border:1px solid var(--border);border-radius:var(--r-sm);
  background:var(--surface);color:var(--text);font-size:.95rem;min-height:42px
}
input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
input[type=number]{font-variant-numeric:tabular-nums}
.hint{font-size:.75rem;color:var(--text-2);margin-top:.25rem}
.form-2{display:grid;gap:0 .9rem;grid-template-columns:1fr}
@media (min-width:560px){.form-2{grid-template-columns:1fr 1fr}}

.filters{display:flex;gap:.6rem;flex-wrap:wrap;align-items:flex-end;margin-bottom:1rem}
.filters .form-group{margin:0;min-width:140px;flex:1}
.filters label{font-size:.7rem}

.overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(2px);
  display:none;align-items:flex-end;justify-content:center;z-index:60;padding:0
}
.overlay.open{display:flex}
.modal{
  background:var(--surface);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;
  border-radius:var(--r) var(--r) 0 0;padding:1.25rem;
  padding-bottom:calc(1.25rem + env(safe-area-inset-bottom));
  animation:rise .22s ease
}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (min-width:900px){
  .overlay{align-items:center;padding:1.5rem}
  .modal{border-radius:var(--r);animation:fade .18s ease}
}
@keyframes fade{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:1rem}
.modal-head h2{font-size:1.1rem;font-weight:700}
.icon-btn{width:34px;height:34px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--text-2);font-size:1.3rem;line-height:1;flex:0 0 34px}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}

.toasts{position:fixed;z-index:90;left:1rem;right:1rem;bottom:calc(var(--nav-h) + 5rem);display:flex;flex-direction:column;gap:.5rem;pointer-events:none}
@media (min-width:900px){.toasts{left:auto;right:1.5rem;bottom:1.5rem;width:360px}}
.toast{
  background:var(--text);color:var(--bg);padding:.7rem 1rem;border-radius:var(--r-sm);
  font-size:.875rem;font-weight:500;box-shadow:var(--shadow-lg);animation:rise .2s ease
}
.toast.err{background:var(--error);color:#fff}
.toast.ok{background:var(--accent);color:#052e20}

.chart{display:flex;align-items:flex-end;gap:.4rem;height:150px;padding-top:.5rem}
.chart-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:.35rem;min-width:0}
.chart-bar{width:100%;max-width:42px;background:linear-gradient(180deg,var(--primary),var(--primary-600));border-radius:5px 5px 0 0;min-height:3px;position:relative}
.chart-bar::after{
  content:attr(data-label);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
  font-size:.65rem;font-weight:700;color:var(--text-2);margin-bottom:3px;white-space:nowrap
}
.chart-x{font-size:.62rem;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

.page{display:none}
.page.active{display:block}
.section-sub{font-size:.8rem;color:var(--text-2);margin-top:-.5rem;margin-bottom:1rem}

.login-wrap{min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:linear-gradient(140deg,#1E3A5F,#2d4a6f 60%,#0f2440)}
.login-card{background:var(--surface);border-radius:var(--r);width:100%;max-width:400px;padding:1.75rem;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.login-card h1{text-align:center;margin-bottom:1.5rem;display:grid;gap:.6rem;justify-items:center}
.login-card h1 .brand-mark{width:52px;height:52px;font-size:1.5rem}
.login-card h1 small{font-size:.75rem;color:var(--text-2);font-weight:500}
@media (min-width:900px){.form-2.tight{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login" class="login-wrap" hidden>
  <form class="login-card" id="loginForm">
    <h1>
      <span class="brand-mark">🚛</span>
      <span>Driver Ledger<small>Fuel tracking for Philippine fleets</small></span>
    </h1>
    <div class="form-group">
      <label for="lgUser">Username</label>
      <input id="lgUser" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label for="lgPass">Password</label>
      <input id="lgPass" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn-primary" style="width:100%" type="submit">Sign in</button>
  </form>
</div>

<!-- ============ APP ============ -->
<div id="shell" class="shell" hidden>
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">🚛</span>
      <span>Driver Ledger<small>Fuel Ledger PH</small></span>
    </div>
    <nav class="nav" id="sideNav" aria-label="Main"></nav>
    <div class="sidebar-foot">
      <div class="who">
        <span class="avatar" id="avatar">–</span>
        <span class="who-txt"><b id="whoName">–</b><span id="whoRole">–</span></span>
      </div>
      <div class="btn-row" style="padding:0 .5rem .5rem">
        <button class="btn btn-ghost btn-sm" id="themeBtnSide" title="Toggle theme">🌙 Dark</button>
        <button class="btn btn-ghost btn-sm" id="logoutBtnSide">Sign out</button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1 id="pageTitle">Dashboard</h1>
      <div class="btn-row">
        <button class="btn btn-ghost btn-sm" id="themeBtnTop" title="Toggle theme">🌙</button>
        <button class="btn btn-ghost btn-sm" id="logoutBtnTop">Sign out</button>
      </div>
    </header>

    <main class="content" id="content">
      <section class="page active" id="page-dashboard"></section>
      <section class="page" id="page-records"></section>
      <section class="page" id="page-drivers"></section>
      <section class="page" id="page-users" hidden></section>
      <section class="page" id="page-settings"></section>
    </main>
  </div>

  <button class="fab" id="fab" title="Add fuel entry" aria-label="Add fuel entry">+</button>
  <nav class="bottomnav" id="botNav" aria-label="Main"></nav>
</div>

<div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-head">
    <h2 id="modalTitle"></h2>
    <button class="icon-btn" id="modalClose" aria-label="Close">×</button>
  </div>
  <div id="modalBody"></div>
</div></div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

/* ------------------------------------------------------------------ state */
const state = {
  token: localStorage.getItem('dl_token') || null,
  user: JSON.parse(localStorage.getItem('dl_user') || 'null'),
  drivers: [],
  records: [],
  users: [],
  stats: null,
  year: String(new Date().getFullYear()),
  driverFilter: 'all',
  page: 'dashboard',
};

const PAGES = {
  dashboard: { label: 'Dashboard', icon: 'M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z', roles: ['admin', 'manager', 'viewer', 'driver'] },
  records:   { label: 'Records',   icon: 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h8', roles: ['admin', 'manager', 'viewer', 'driver'] },
  drivers:   { label: 'Drivers',   icon: 'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M23 21v-2a4 4 0 0 0-3-3.87', roles: ['admin', 'manager', 'viewer'] },
  users:     { label: 'Users',     icon: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.87', roles: ['admin'] },
  settings:  { label: 'Settings',  icon: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1', roles: ['admin', 'manager', 'viewer', 'driver'] },
};

const isAdmin = () => state.user && state.user.role === 'admin';
const canWrite = () => state.user && (state.user.role === 'admin' || state.user.role === 'manager');

/* ------------------------------------------------------------------ utils */
const esc = (v) => String(v === null || v === undefined ? '' : v)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

const peso = (n) => '₱' + Number(n || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const peso0 = (n) => '₱' + Math.round(Number(n || 0)).toLocaleString('en-PH');
const num = (n, d = 1) => Number(n || 0).toFixed(d);
const todayISO = () => new Date().toISOString().slice(0, 10);

function fmtDate(iso) {
  if (!iso) return '–';
  const d = new Date(`${String(iso).slice(0, 10)}T00:00:00`);
  if (Number.isNaN(d.getTime())) return esc(iso);
  return d.toLocaleDateString('en-PH', { day: '2-digit', month: 'short', year: 'numeric' });
}
function fmtMonth(m) {
  const d = new Date(`${m}-01T00:00:00`);
  return Number.isNaN(d.getTime()) ? m : d.toLocaleDateString('en-PH', { month: 'short', year: '2-digit' });
}
function toast(msg, kind = '') {
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 3200);
  setTimeout(() => el.remove(), 3600);
}

/* ------------------------------------------------------------------ api */
async function api(path, options = {}) {
  const opts = { ...options, headers: { ...(options.headers || {}) } };
  if (opts.body !== undefined) opts.headers['Content-Type'] = 'application/json';
  if (state.token) opts.headers['Authorization'] = `Bearer ${state.token}`;

  let res;
  try {
    res = await fetch(path, opts);
  } catch {
    throw new Error('Cannot reach the server. Check your connection.');
  }

  let data = null;
  const text = await res.text();
  if (text) { try { data = JSON.parse(text); } catch { data = null; } }

  if (res.status === 401 && state.token) {
    logout(true);
    throw new Error('Session expired. Please sign in again.');
  }
  if (!res.ok) throw new Error((data && data.error) || `Request failed (${res.status})`);
  return data;
}

/* ------------------------------------------------------------------ shell */
function allowedPages() {
  return Object.keys(PAGES).filter((k) => PAGES[k].roles.includes(state.user.role));
}

function buildNav() {
  const pages = allowedPages();
  const item = (k) => {
    const p = PAGES[k];
    return `<button class="nav-btn" data-nav="${k}"${state.page === k ? ' aria-current="page"' : ''}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${p.icon}"/></svg>
      <span>${p.label}</span></button>`;
  };
  $('#sideNav').innerHTML = pages.map(item).join('');
  $('#botNav').innerHTML = pages.map(item).join('');
  $('#page-users').hidden = !isAdmin();

  const initials = (state.user.username || '?').slice(0, 2).toUpperCase();
  $('#avatar').textContent = initials;
  $('#whoName').textContent = state.user.username;
  $('#whoRole').textContent = state.user.role;
}

function go(page) {
  if (!allowedPages().includes(page)) page = 'dashboard';
  state.page = page;
  $$('.page').forEach((p) => p.classList.remove('active'));
  const el = $(`#page-${page}`);
  el.classList.add('active');
  el.hidden = false;
  $('#pageTitle').textContent = PAGES[page].label;
  buildNav();
  render(page);
  window.scrollTo(0, 0);
}

/* ------------------------------------------------------------------ data */
async function loadData() {
  const [drivers, records, stats] = await Promise.all([
    api('/api/drivers'),
    api('/api/records'),
    api(`/api/stats${state.year !== 'all' ? `?year=${state.year}` : ''}`),
  ]);
  state.drivers = drivers;
  state.records = records;
  state.stats = stats;
  if (isAdmin()) {
    state.users = await api('/api/users');
  } else {
    state.users = [];
  }
}

const driverById = (id) => state.drivers.find((d) => d.id === Number(id));
const visibleDrivers = () => (state.user.role === 'driver'
  ? state.drivers.filter((d) => d.id === state.user.driverId)
  : state.drivers);

/* ------------------------------------------------------------------ render */
function render(page) {
  ({
    dashboard: renderDashboard,
    records: renderRecords,
    drivers: renderDrivers,
    users: renderUsers,
    settings: renderSettings,
  }[page] || renderDashboard)();
}

function yearOptions(selected) {
  const now = new Date().getFullYear();
  const years = [];
  for (let y = now; y >= now - 4; y -= 1) years.push(y);
  return years.map((y) => `<option value="${y}"${String(y) === String(selected) ? ' selected' : ''}>${y}</option>`).join('');
}

  const fleetAvg = (() => {
    const km = withActual.reduce((a, d) => a + d.totalKm, 0);
    const l = withActual.reduce((a, d) => a + (d.totalKm / d.avgKmPerLiter), 0);
    return l > 0 ? km / l : null;

  const monthly = (s && s.monthly) || [];

  $('#page-dashboard').innerHTML = `

function showReport(year) {
  const per = (state.stats.perDriver || []).filter((d) => d.entries > 0);
  const rows = per.map((d) => ({ name: d.driver.name, vehicle: d.driver.vehicle, plate: d.driver.plate, liters: d.liters, cost: d.cost, kmpl: d.avgKmPerLiter }));
  if (!rows.length) {
    $('#reportOut').innerHTML = '<div class="empty"><span class="em">📄</span>No activity for ' + esc(year) + '</div>';
    return;
  }
  const tl = rows.reduce((a, r) => a + r.liters, 0);
  const tc = rows.reduce((a, r) => a + r.cost, 0);
  $('#reportOut').innerHTML = `<div class="table-wrap"><table>
    <thead><tr><th>Driver</th><th>Vehicle</th><th class="num">Litres</th><th class="num">Cost</th><th class="num">km/L</th></tr></thead>
    <tbody>${rows.map((r) => `<tr>
      <td><b>${esc(r.name)}</b><br><small style="color:var(--text-2)">${esc(r.plate || '')}</small></td>
      <td>${esc(r.vehicle)}</td><td class="num">${num(r.liters)}</td>
      <td class="num money">${esc(peso(r.cost))}</td>
      <td class="num">${r.kmpl ? num(r.kmpl) : '–'}</td></tr>`).join('')}
      <tr><td colspan="2"><b>Total</b></td><td class="num"><b>${num(tl)}</b></td><td class="num money"><b>${esc(peso(tc))}</b></td><td></td></tr>
    </tbody></table></div>`;
}

/* ------------------------------------------------------------------ modals */
function openModal(title, html) {
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = html;
  $('#overlay').classList.add('open');
  const first = $('#modalBody input, #modalBody select, #modalBody button');
  if (first) setTimeout(() => first.focus(), 60);
}
function closeModal() { $('#overlay').classList.remove('open'); $('#modalBody').innerHTML = ''; }

const driverOptions = (sel) => state.drivers.map((d) =>
  `<option value="${d.id}"${String(d.id) === String(sel) ? ' selected' : ''}>${esc(d.name)} — ${esc(d.plate || d.vehicle)}</option>`).join('');

function openEntryModal(id = null) {
  if (!state.drivers.length) { toast('Add a driver first', 'err'); return; }
  const r = id ? state.records.find((x) => x.id === id) : null;
  const d = r ? driverById(r.driverId) : state.drivers[0];

  openModal(r ? 'Edit fuel entry' : 'Add fuel entry', `
    <form id="entryForm">
      <div class="form-group"><label for="eDriver">Driver</label>
        <select id="eDriver" required>${driverOptions(r ? r.driverId : d.id)}</select></div>
      <div class="form-2">
        <div class="form-group"><label for="eDate">Date</label>
          <input type="date" id="eDate" value="${r ? esc(String(r.date).slice(0, 10)) : todayISO()}" max="${todayISO()}" required></div>
        <div class="form-group"><label for="eOdo">Odometer (km)</label>
          <input type="number" id="eOdo" min="0" step="1" value="${r ? r.odometer || '' : ''}" placeholder="e.g. 128450">
          <div class="hint">Needed to calculate real km/L</div></div>
      </div>
      <div class="form-2">
        <div class="form-group"><label for="eLiters">Litres</label>
          <input type="number" id="eLiters" min="0.01" max="2000" step="0.01" value="${r ? r.liters : ''}" required></div>
        <div class="form-group"><label for="ePrice">Price per litre (₱)</label>
          <input type="number" id="ePrice" min="0.01" max="10000" step="0.01" value="${r ? r.pricePerLiter : (d.defaultPrice || 60)}" required></div>
      </div>
      <div class="card" style="background:var(--surface-2);margin:0 0 1rem">
        <div style="display:flex;justify-content:space-between;font-weight:700">
          <span>Total</span><span id="eTotal">₱0.00</span>
        </div>
      </div>
      <button class="btn btn-primary" style="width:100%" type="submit">${r ? 'Save changes' : 'Add entry'}</button>
    </form>`);

  const calc = () => {
    const total = (parseFloat($('#eLiters').value) || 0) * (parseFloat($('#ePrice').value) || 0);
    $('#eTotal').textContent = peso(total);
  };
  $('#eLiters').oninput = calc;
  $('#ePrice').oninput = calc;
  $('#eDriver').onchange = () => {
    const sel = driverById($('#eDriver').value);
    if (sel && !r) $('#ePrice').value = sel.defaultPrice || 60;
    calc();
  };
  calc();

  $('#entryForm').onsubmit = async (ev) => {
    ev.preventDefault();
    const payload = {
      driverId: Number($('#eDriver').value),
      date: $('#eDate').value,
      liters: parseFloat($('#eLiters').value),
      pricePerLiter: parseFloat($('#ePrice').value),
      odometer: parseFloat($('#eOdo').value) || 0,
    };
    try {
      await api(r ? `/api/records/${r.id}` : '/api/records', {
        method: r ? 'PUT' : 'POST', body: JSON.stringify(payload),
      });
      toast(r ? 'Entry updated' : 'Entry added', 'ok');
      closeModal();
      await loadData();
      render(state.page);
    } catch (e) { toast(e.message, 'err'); }
  };
}

function openDriverModal(id = null) {
  const d = id ? driverById(id) : null;
  openModal(d ? 'Edit driver' : 'Add driver', `
    <form id="driverForm">
      <div class="form-group"><label for="dName">Driver name</label>
        <input id="dName" value="${d ? esc(d.name) : ''}" required maxlength="120"></div>
      <div class="form-2">
        <div class="form-group"><label for="dVehicle">Vehicle</label>
          <input id="dVehicle" value="${d ? esc(d.vehicle) : ''}" placeholder="Isuzu Elf 4WD2" required maxlength="120"></div>
        <div class="form-group"><label for="dPlate">Plate number</label>
          <input id="dPlate" value="${d ? esc(d.plate || '') : ''}" placeholder="NCR 8452" maxlength="32"></div>
      </div>
      <div class="form-2">
        <div class="form-group"><label for="dFuel">Fuel type</label>
          <select id="dFuel"><option value="diesel"${d && d.fuelType === 'diesel' ? ' selected' : ''}>Diesel</option>
          <option value="petrol"${d && d.fuelType === 'petrol' ? ' selected' : ''}>Petrol</option></select></div>
        <div class="form-group"><label for="dRate">Rated consumption (km/L)</label>
          <input type="number" id="dRate" min="0" max="100" step="0.1" value="${d ? d.consumptionRate : ''}" required>
          <div class="hint">Manufacturer figure – actual is measured from odometer</div></div>
      </div>
      <div class="form-group"><label for="dPrice">Default price per litre (₱)</label>
        <input type="number" id="dPrice" min="0" max="10000" step="0.01" value="${d ? d.defaultPrice : '68.00'}" required>
        <div class="hint">Pre-fills new entries; edit per fill-up when the price changes</div></div>
      <button class="btn btn-primary" style="width:100%" type="submit">${d ? 'Save driver' : 'Add driver'}</button>
    </form>`);

  $('#driverForm').onsubmit = async (ev) => {
    ev.preventDefault();
    const payload = {
      name: $('#dName').value, vehicle: $('#dVehicle').value, plate: $('#dPlate').value,
      fuelType: $('#dFuel').value, consumptionRate: parseFloat($('#dRate').value),
      defaultPrice: parseFloat($('#dPrice').value),
    };
    try {
      await api(d ? `/api/drivers/${d.id}` : '/api/drivers', {
        method: d ? 'PUT' : 'POST', body: JSON.stringify(payload),
      });
      toast(d ? 'Driver updated' : 'Driver added', 'ok');
      closeModal();
      await loadData();
      render(state.page);
    } catch (e) { toast(e.message, 'err'); }
  };
}

function openUserModal(id = null) {
  const u = id ? state.users.find((x) => x.id === id) : null;
  openModal(u ? 'Edit user' : 'Add user', `
    <form id="userForm">
      <div class="form-group"><label for="uName">Username</label>
        <input id="uName" value="${u ? esc(u.username) : ''}" ${u ? 'disabled' : ''} required
               pattern="[A-Za-z0-9._-]{3,64}" autocomplete="off">
        ${u ? '' : '<div class="hint">Letters, numbers, dot, dash, underscore</div>'}</div>
      <div class="form-group"><label for="uPass">${u ? 'New password' : 'Password'}</label>
        <input type="password" id="uPass" ${u ? 'placeholder="Leave empty to keep current"' : ''} minlength="8" autocomplete="new-password" ${u ? '' : 'required'}>
        <div class="hint">Minimum 8 characters</div></div>
      <div class="form-2">
        <div class="form-group"><label for="uRole">Role</label>
          <select id="uRole">
            <option value="viewer"${u && u.role === 'viewer' ? ' selected' : ''}>Viewer – read only</option>
            <option value="manager"${u && u.role === 'manager' ? ' selected' : ''}>Manager – can add and edit</option>
            <option value="driver"${u && u.role === 'driver' ? ' selected' : ''}>Driver – own records only</option>
            <option value="admin"${u && u.role === 'admin' ? ' selected' : ''}>Admin – full control</option>
          </select></div>
        <div class="form-group" id="uDriverWrap" ${u && u.role === 'driver' ? '' : 'hidden'}><label for="uDriver">Linked driver</label>
          <select id="uDriver">${driverOptions(u ? u.driverId : '')}</select>
          <div class="hint">Driver sees only their own fill-ups</div></div>
      </div>
      <button class="btn btn-primary" style="width:100%" type="submit">${u ? 'Save user' : 'Create user'}</button>
    </form>`);

  $('#uRole').onchange = () => { $('#uDriverWrap').hidden = $('#uRole').value !== 'driver'; };

  $('#userForm').onsubmit = async (ev) => {
    ev.preventDefault();
    const role = $('#uRole').value;
    const payload = {
      role,
      driverId: role === 'driver' ? Number($('#uDriver').value) : null,
    };
    if ($('#uPass').value) payload.password = $('#uPass').value;
    try {
      if (u) {
        await api(`/api/users/${u.id}`, { method: 'PUT', body: JSON.stringify(payload) });
      } else {
        await api('/api/users', { method: 'POST', body: JSON.stringify({ ...payload, username: $('#uName').value, password: $('#uPass').value }) });
      }
      toast(u ? 'User updated' : 'User created', 'ok');
      closeModal();
      await loadData();
      render(state.page);
    } catch (e) { toast(e.message, 'err'); }
  };
}

/* ------------------------------------------------------------------ export */
function downloadBlob(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

function exportCSV(list) {
  const esc2 = (v) => `"${String(v === null || v === undefined ? '' : v).replace(/"/g, '""')}"`;
  const head = ['Date', 'Driver', 'Vehicle', 'Plate', 'Litres', 'Price per litre', 'Total PHP', 'Odometer km'];
  const rows = list.map((r) => {
    const d = driverById(r.driverId);
    return [r.date, d ? d.name : 'Unassigned', d ? d.vehicle : '', d ? d.plate || '' : '',
      r.liters, r.pricePerLiter, r.total, r.odometer].map(esc2).join(',');
  });
  // BOM so Excel opens the peso/UTF-8 content correctly.
  downloadBlob(new Blob(['﻿' + [head.map(esc2).join(','), ...rows].join('\r\n')], { type: 'text/csv;charset=utf-8' }),
    `fuel_records_${state.year}.csv`);
  toast('CSV downloaded', 'ok');
}

async function exportPDF(list) {
  if (!window.jspdf) { toast('PDF library unavailable offline', 'err'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const W = doc.internal.pageSize.getWidth();
  const H = doc.internal.pageSize.getHeight();
  const M = 42;

  doc.setFillColor(30, 58, 95);
  doc.rect(0, 0, W, 74, 'F');
  doc.setTextColor(255, 255, 255).setFontSize(17).setFont('helvetica', 'bold');
  doc.text('Driver Ledger PH', M, 33);
  doc.setFontSize(10).setFont('helvetica', 'normal');
  doc.text(`Fuel expenditure report — ${state.year === 'all' ? 'All time' : state.year}`, M, 51);
  doc.setFontSize(8);
  doc.text(`Generated ${new Date().toLocaleDateString('en-PH')}`, W - M, 51, { align: 'right' });

  let y = 104;
  const cols = [
    { label: 'Date', w: 70, get: (r) => r.date },
    { label: 'Driver', w: 120, get: (r) => { const d = driverById(r.driverId); return d ? d.name : '—'; } },
    { label: 'Litres', w: 55, get: (r) => num(r.liters), align: 'right' },
    { label: '₱/L', w: 58, get: (r) => Number(r.pricePerLiter).toFixed(2), align: 'right' },
    { label: 'Total', w: 72, get: (r) => Number(r.total).toFixed(2), align: 'right' },
    { label: 'Odo', w: 60, get: (r) => (r.odometer ? num(r.odometer, 0) : '—'), align: 'right' },
  ];

  const header = () => {
    doc.setFontSize(7.5).setFont('helvetica', 'bold').setTextColor(110);
    let x = M;
    cols.forEach((c) => {
      doc.text(c.label.toUpperCase(), c.align === 'right' ? x + c.w - 4 : x, y, { align: c.align || 'left' });
      x += c.w;
    });
    y += 5;
    doc.setDrawColor(200).line(M, y, W - M, y);
    y += 13;
    doc.setFont('helvetica', 'normal').setFontSize(9).setTextColor(20);
  };
  header();

  list.forEach((r) => {
    if (y > H - 70) {
      doc.addPage();
      y = 60;
      header();
    }
    let x = M;
    cols.forEach((c) => {
      doc.text(String(c.get(r)), c.align === 'right' ? x + c.w - 4 : x, y, { align: c.align || 'left' });
      x += c.w;
    });
    y += 16;
  });

  const tl = list.reduce((a, r) => a + r.liters, 0);
  const tc = list.reduce((a, r) => a + r.total, 0);
  if (y > H - 90) { doc.addPage(); y = 60; }
  y += 10;
  doc.setDrawColor(30, 58, 95).setLineWidth(1).line(M, y, W - M, y);
  doc.setLineWidth(0.4);
  y += 20;
  doc.setFont('helvetica', 'bold').setFontSize(11).setTextColor(30, 58, 95);
  doc.text(`Total litres: ${num(tl)}`, M, y);
  doc.text(`Total cost: ₱${tc.toLocaleString('en-PH', { minimumFractionDigits: 2 })}`, M + 230, y);

  doc.save(`fuel_report_${state.year}.pdf`);
  toast('PDF downloaded', 'ok');
}

/* ------------------------------------------------------------------ theme */
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('dl_theme', t);
  const dark = t === 'dark';
  $('#themeBtnTop').textContent = dark ? '☀️' : '🌙';
  $('#themeBtnSide').textContent = dark ? '☀️ Light' : '🌙 Dark';
  document.querySelector('meta[name=theme-color]').setAttribute('content', dark ? '#0F172A' : '#1E3A5F');
}
function toggleTheme() {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
}

/* ------------------------------------------------------------------ auth */
function logout(silent) {
  state.token = null; state.user = null;
  localStorage.removeItem('dl_token'); localStorage.removeItem('dl_user');
  if (!silent) api('/api/logout', { method: 'POST' }).catch(() => {});
  showLogin();
  if (!silent) toast('Signed out');
}

function showLogin() {
  $('#shell').hidden = true;
  $('#login').hidden = false;
  $('#lgUser').focus();
}

async function showApp() {
  $('#login').hidden = true;
  $('#shell').hidden = false;
  await loadData();
  go('dashboard');
}

$('#loginForm').onsubmit = async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button[type=submit]');
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const res = await api('/api/login', { method: 'POST', body: JSON.stringify({
      username: $('#lgUser').value, password: $('#lgPass').value,
    }) });
    state.token = res.token; state.user = res.user;
    localStorage.setItem('dl_token', res.token);
    localStorage.setItem('dl_user', JSON.stringify(res.user));
    await showApp();
  } catch (err) {
    toast(err.message, 'err');
  } finally {
    btn.disabled = false; btn.textContent = 'Sign in';
  }
};

$('#modalClose').onclick = closeModal;
$('#overlay').onclick = (e) => { if (e.target === $('#overlay')) closeModal(); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
$('#themeBtnTop').onclick = toggleTheme;
$('#themeBtnSide').onclick = toggleTheme;
$('#logoutBtnTop').onclick = () => logout();
$('#logoutBtnSide').onclick = () => logout();
$('#fab').onclick = () => openEntryModal();

document.addEventListener('click', (e) => {
  const nav = e.target.closest('[data-nav]');
  if (nav) { go(nav.dataset.nav); }
});

(async function boot() {
  applyTheme(localStorage.getItem('dl_theme') || 'light');
  if (state.token && state.user) {
    try {
      await showApp();
      return;
    } catch (e) { /* fall through to login */ }
  }
  showLogin();
})();
</script>
